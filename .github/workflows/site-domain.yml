name: Site domain checks
on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the website preview
        run: node app/build.mjs
      - name: Verify canonical, sitemap and retired-host URLs
        env:
          SITE_URL: https://tianfu.wang/gen-mentor/
          SITE_DIR: .
        run: python3 scripts/verify-domain.py
